name: ClipRush brain

# Runs every 5 minutes for free (public repository). For exact timing, a free cron-job.org
# job can also call the repository_dispatch trigger below (see README, step 6).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tick]

permissions:
  contents: write

concurrency:
  group: cliprush-brain
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -U yt-dlp
      - name: Run one cycle
        env:
          CLIPRUSH_PASSWORD: ${{ secrets.CLIPRUSH_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m brain run --mode cloud --deadline 480
